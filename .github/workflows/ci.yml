name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rekaman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/rekaman_test
      JWT_SECRET: test-secret-must-be-at-least-32-characters-long-for-validation
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @rekaman/server prisma:generate

      - name: Run migrations
        run: pnpm --filter @rekaman/server prisma:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm --filter @rekaman/server lint

      - name: Test
        run: pnpm --filter @rekaman/server test
