    <meta charset="UTF-8" />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font: 16px/1.6 system-ui, -apple-system, sans-serif; color: #111; background: #fafafa; }
      .container { max-width: 800px; margin: 0 auto; padding: 32px 16px; }
      h1 { font-size: 32px; margin-bottom: 8px; }
      .price { font-size: 22px; color: #6366f1; margin-bottom: 16px; font-weight: 600; }
      .photo {
        width: 100%; aspect-ratio: 4/3; background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        border-radius: 12px; display: flex; align-items: center;
        justify-content: center; color: #888; margin-bottom: 24px;
        font-size: 14px;
      }
      .meta { color: #555; margin-bottom: 24px; line-height: 1.8; }
      .meta strong { color: #111; }
      footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid #eee; color: #888; font-size: 13px; }
      footer a { color: #6366f1; text-decoration: none; }
    </style>
  </head>
  <body>
    <!-- TEMPORARY DEBUG OVERLAY — remove after diagnosis -->
    <div id="dbg" style="position:fixed;top:0;left:0;right:0;background:#000;color:#0f0;padding:8px;font:11px/1.35 ui-monospace,Menlo,monospace;z-index:99999;max-height:45vh;overflow-y:auto;border-bottom:2px solid #0f0;white-space:pre-wrap;word-break:break-word"></div>
    <script>
    (function() {
      var dbg = document.getElementById('dbg');
      function log(msg) {
        var ts = new Date().toISOString().slice(11, 23);
        var line = document.createElement('div');
        line.textContent = ts + '  ' + msg;
        dbg.appendChild(line);
        dbg.scrollTop = dbg.scrollHeight;
      }
      window.__rkLog = log;
      log('UA: ' + navigator.userAgent);
      log('xr: ' + ('xr' in navigator ? 'present' : 'MISSING'));
      log('isSecureContext: ' + window.isSecureContext);
      if (navigator.xr) {
        navigator.xr.isSessionSupported('immersive-ar')
          .then(function(s) { log('immersive-ar supported: ' + s); })
          .catch(function(e) { log('isSessionSupported err: ' + (e && e.message || e)); });
      }

      // Hook console
      ['warn','error','log'].forEach(function(level) {
        var orig = console[level];
        console[level] = function() {
          var msg = '[' + level + '] ';
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            try { msg += (typeof a === 'object' ? JSON.stringify(a) : String(a)) + ' '; }
            catch (e) { msg += '<unserializable> '; }
          }
          log(msg);
          orig.apply(console, arguments);
        };
      });

      window.addEventListener('error', function(e) {
        log('[uncaught] ' + (e.message || 'unknown') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
      });
      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        log('[promise rejected] ' + (r && r.message ? r.message : (r && r.toString ? r.toString() : String(r))));
      });

      // Document-level click delegation (catches Shadow DOM clicks via composedPath)
      document.addEventListener('click', function(e) {
        try {
          var path = (e.composedPath ? e.composedPath() : [e.target]);
          var first = path[0];
          var tag = first && (first.tagName || first.nodeName) || '?';
          var cls = first && first.className || '';
          log('[click] ' + tag + (cls ? '.' + cls : ''));
        } catch (err) { log('[click] (path err)'); }
      }, true);

      // Periodic peek at SDK state
      var peek = 0;
      var iv = setInterval(function() {
        peek++;
        if (window.Rekaman) {
          var inst = window.Rekaman.__instances && window.Rekaman.__instances[0];
          var msg = 'Rekaman v' + window.Rekaman.version + ' instances=' + (window.Rekaman.__instances || []).length;
          if (inst) msg += ' platform=' + inst.platform + ' product=' + (inst.product ? 'loaded' : 'null');
          log(msg);
          if (inst && inst.product) clearInterval(iv);
        }
        if (peek > 12) clearInterval(iv);
      }, 500);
    })();
    </script>

    <div class="container">
      <div class="photo">[ Product photo placeholder ]</div>

      <h1>Oslo 3-Seater Sofa</h1>
      <div class="price">₹64,999</div>
      <div class="meta">
        <strong>Fabric upholstered.</strong> Solid wood frame. Available in Slate, Indigo, Cream.<br>
        <strong>Dimensions:</strong> 220cm × 95cm × 85cm<br>
        <strong>Free delivery & assembly</strong> across India.
      </div>

      <!-- THE REKAMAN INTEGRATION — ONE SCRIPT TAG, ONE DIV -->
      <div data-rk-product="oslo-sofa" data-rk-key="rk_live_wW8dUxrRLB1_IOEUZj_5vZNFE95PUTGE"></div>
      <script src="https://d3ens3al2ub47k.cloudfront.net/v1/sdk.js" defer></script>

      <footer>
        Powered by <a href="https://rekaman.io">Rekaman</a> · Spatial commerce for any brand.
      </footer>
    </div>
  </body>
</html>
